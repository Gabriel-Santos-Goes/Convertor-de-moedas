<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto | Conversor de Moedas</title>
    <link rel="stylesheet" href="style.css">

<body>

        <h1>Conversor de Moedas</h1>

    <main>
        <p>Bem-vindo ao Conversor de Moedas!</p>
